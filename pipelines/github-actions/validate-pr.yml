name: Salesforce CI — Validate PR

on:
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate:
    name: Validate against Integration Sandbox
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Authenticate to sandbox
        run: |
          echo "${{ secrets.SF_AUTH_URL }}" > ./auth-url.txt
          sf org login sfdx-url --sfdx-url-file ./auth-url.txt --alias integration-sandbox
          rm ./auth-url.txt

      - name: Validate deployment (dry run)
        run: |
          sf project deploy start \
            --target-org integration-sandbox \
            --dry-run \
            --test-level RunLocalTests \
            --source-dir force-app

      - name: Report results
        if: always()
        run: sf project deploy report
